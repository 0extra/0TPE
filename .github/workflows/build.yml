name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Generate cert and keys
        run: |
          chmod +x scripts/gen_cert.sh scripts/gen_keys.sh
          ./scripts/gen_cert.sh
          ./scripts/gen_keys.sh

      - name: Build
        run: make clean && make

      - name: Test protocol
        run: ./otpe-test

      - name: Test crypto
        run: ./otpe-test-crypto

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build fuzzer
        run: make fuzz

      - name: Prepare corpus directory
        run: mkdir -p fuzz/corpus

      - name: Fuzz for 60 seconds
        run: ./fuzz/fuzz_clienthello fuzz/corpus -max_total_time=60 -rss_limit_mb=2048
